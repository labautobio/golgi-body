# 3d_catalog フォルダを GitHub Pages のサイトのルートとして公開する
# 初回だけ：Settings → Pages → Build and deployment の Source を「GitHub Actions」にする
# 成果物のアップロード（build）と公開（deploy）を別のジョブに分ける（同じジョブだと deploy が成果物を見つけられないことがある）
name: Deploy 3d_catalog to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "3d_catalog/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: 3d_catalog

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
